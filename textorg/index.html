<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text org</title>
</head>
<style>
    *{
        margin:0;
        padding:0;
    }
    div{
        border:1px solid black;
        margin:1rem;
    }
</style>
<body>
    <h1>text organizer</h1>
    <input type="text" id="text" placeholder="add text here">
    <button id="addtext">Add text</button>
    <input type="text" id="group" placeholder="group name here">
    <button id="addgroup">Add Group</button>
    <div id="container" style="border:1px solid black; margin:2rem;"></div>
    <select>
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
    </select>

    <script>
        const addText = document.getElementById("addtext")
        const addGroup = document.getElementById("addgroup")
        const display = document.getElementById("container")

        let texts = [];
        let groups = [];

        addText.addEventListener("click", ()=>{
            texts.push({text: document.getElementById("text").value, group: "none"});
            document.getElementById("text").value="";

            load();
        })
        addGroup.addEventListener("click", ()=>{
            groups.push({name: document.getElementById("group").value});
            document.getElementById("group").value="";
            load()
        })
        function load(){
            display.innerHTML="";
            
            for(let i =0;i<texts.length;i++){
                const element = document.createElement("div");
                const content=document.createElement("p");
                content.innerHTML=`${texts[i].text}`
                console.log(texts[i].group, "GROUP")

                const select = document.createElement("select");
                const ph = document.createElement("option");
                ph.value="Group";
                ph.innerHTML="Group"
                select.appendChild(ph);
                for(let j=0; j<groups.length;j++){
                    const option = document.createElement("option");
                    option.value=groups[j].name;
                    option.innerHTML=groups[j].name;
                    
                    console.log(groups[j].name, "NAME")
                    if(texts[i].group===groups[j].name && texts[i].group!="none"){
                        option.selected=true;
                        console.log("PUSHIED")
                    }
                    select.appendChild(option);
                }
                element.appendChild(select);
                element.appendChild(content);

                display.appendChild(element)
            }
        }
    </script>
</body>
</html>
